name: Build Arch Linux package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - name: Build package (makepkg)
        run: |
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd linux
          # electron wird erst beim Installieren gebraucht (pacman holt es automatisch)
          su builder -c "makepkg -f --nodeps"
          ls -lh *.pkg.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: claude-terminal-arch
          path: linux/*.pkg.tar.zst
